<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEXORA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <!-- VEXORA LOGO -->
        <a href="#" class="brand">
            <img src="vexoralogo.png" alt="VEXORA">
        </a>

        <!-- NAV -->
        <nav class="nav-buttons">

            <!-- HOME -->
            <a href="#" class="nav-button active" aria-label="Home">
                <svg viewBox="0 0 24 24">
                    <path d="M3 10.5L12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5v-9z"/>
                </svg>
            </a>

            <!-- DISCORD -->
            <a href="https://discord.gg/bY77RD95H" class="nav-button" aria-label="Discord">
                <svg viewBox="0 0 24 24">
                    <path d="M19.54 5.06A16.2 16.2 0 0 0 15.47 3.8l-.5 1.02a14.9 14.9 0 0 0-5.94 0L8.53 3.8a16.2 16.2 0 0 0-4.07 1.26C1.88 8.95 1.18 12.75 1.53 16.5a16.5 16.5 0 0 0 4.98 2.52l1.21-1.66a10.3 10.3 0 0 1-1.9-.91l.46-.35c3.68 1.7 7.67 1.7 11.31 0l.47.35c-.6.36-1.24.66-1.9.91l1.21 1.66a16.5 16.5 0 0 0 4.98-2.52c.42-4.35-.72-8.12-2.81-11.44zM8.76 14.45c-1.1 0-2-.99-2-2.2s.88-2.2 2-2.2 2 .99 2 2.2-.9 2.2-2 2.2zm6.48 0c-1.1 0-2-.99-2-2.2s.88-2.2 2-2.2 2 .99 2 2.2-.9 2.2-2 2.2z"/>
                </svg>
            </a>

        </nav>

    </header>


    <main>

        <h2>Games</h2>

        <section class="games">

            <div class="game-card">
                <img src="images/game1.jpg" alt="Game 1">
                <div class="game-info">
                    <h3>Vexora World</h3>
                    <p>👥 0</p>
                </div>
            </div>

            <div class="game-card">
                <img src="images/game2.jpg" alt="Game 2">
                <div class="game-info">
                    <h3>Demo</h3>
                    <p>👥 0</p>
                </div>
            </div>

            <div class="game-card">
                <img src="images/game3.jpg" alt="Game 3">
                <div class="game-info">
                    <h3>Snowy Peak</h3>
                    <p>👥 0</p>
                </div>
            </div>

            <div class="game-card">
                <img src="images/game4.jpg" alt="Game 4">
                <div class="game-info">
                    <h3>The Crossroads</h3>
                    <p>👥 0</p>
                </div>
            </div>

            <div class="game-card">
                <img src="images/game5.jpg" alt="Game 5">
                <div class="game-info">
                    <h3>Backrooms</h3>
                    <p>👥 0</p>
                </div>
            </div>

            <div class="game-card">
                <img src="images/game6.jpg" alt="Game 6">
                <div class="game-info">
                    <h3>Classic House</h3>
                    <p>👥 0</p>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
