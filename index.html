<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEXORA</title>

    <link rel="stylesheet" href="style.css">

<body>

    <!-- HEADER -->
    <header class="header">

        <a href="index.html" class="logo">
            <img src="vexoralogo.png" alt="VEXORA">

            </a>

            <!-- DISCORD -->
            <a href="YOUR_DISCORD_LINK"
               class="nav-button"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Discord">

    </header>


    <!-- MAIN -->
    <main class="main">

        <section class="games-section">

            <h2>Games</h2>

            <div class="games-grid">

                <article class="game-card">
                    <div class="game-image">
                        <span>Game 1</span>
                    </div>
                    <div class="game-info">
                        <h3>Vexora World</h3>
                        <small>♟ 0</small>
                    </div>
                </article>


                <article class="game-card">
                    <div class="game-image">
                        <span>Game 2</span>
                    </div>
                    <div class="game-info">
                        <h3>Demo</h3>
                        <small>♟ 0</small>
                    </div>
                </article>


                <article class="game-card">
                    <div class="game-image">
                        <span>Game 3</span>
                    </div>
                    <div class="game-info">
                        <h3>Snowy Peak</h3>
                        <small>♟ 0</small>
                    </div>
                </article>


                <article class="game-card">
                    <div class="game-image">
                        <span>Game 4</span>
                    </div>
                    <div class="game-info">
                        <h3>The Crossroads</h3>
                        <small>♟ 0</small>
                    </div>
                </article>


                <article class="game-card">
                    <div class="game-image">
                        <span>Game 5</span>
                    </div>
                    <div class="game-info">
                        <h3>Backrooms</h3>
                        <small>♟ 0</small>
                    </div>
                </article>


                <article class="game-card">
                    <div class="game-image">
                        <span>Game 6</span>
                    </div>
                    <div class="game-info">
                        <h3>Classic House</h3>
                        <small>♟ 0</small>
                    </div>
                </article>

            </div>

        </section>

    </main>

            <a href="YOUR_YOUTUBE_LINK"
               target="_blank"
               rel="noopener noreferrer"

                    <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.9V8.1l6.5 3.9-6.5 3.9z"/>
